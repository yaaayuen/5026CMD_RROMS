# Continuous integration: every push and pull request is built and tested.
# A pull request cannot be merged into main unless this workflow passes (branch protection rule).
name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore Rroms.slnx

      - name: Build
        run: dotnet build Rroms.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Rroms.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results (evidence for reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
